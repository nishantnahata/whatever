name: Beer Tracker Android

on:
  push:
    paths:
      - 'beer-tracker-android/**'
      - '.github/workflows/beer-tracker-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beer-tracker-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The Play upload key is stored as repository secrets, never in the repo.
      # Without them the build still runs and produces an unsigned bundle (fine for checking the build).
      - name: Set up upload key
        env:
          BT_KEYSTORE_BASE64: ${{ secrets.BT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$BT_KEYSTORE_BASE64" ]; then
            echo "$BT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "BT_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Upload key found: the bundle will be signed."
          else
            echo "::warning::No BT_KEYSTORE_BASE64 secret: building an UNSIGNED bundle (Google Play will not accept it)."
          fi

      - name: Build release bundle and APK
        env:
          BT_KEYSTORE_PASSWORD: ${{ secrets.BT_KEYSTORE_PASSWORD }}
          BT_KEY_ALIAS: ${{ secrets.BT_KEY_ALIAS }}
          BT_KEY_PASSWORD: ${{ secrets.BT_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Check signature
        if: env.BT_KEYSTORE_FILE != ''
        run: jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Show app details
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          "$AAPT2" dump badging app/build/outputs/apk/release/*.apk | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|launchable-activity)"
          ls -la app/build/outputs/bundle/release/

      - name: Lint (report only)
        continue-on-error: true
        run: |
          ./gradlew --no-daemon lintRelease
          cat app/build/reports/lint-results-release.txt

      - uses: actions/upload-artifact@v4
        with:
          name: beer-tracker-release
          path: |
            beer-tracker-android/app/build/outputs/bundle/release/*.aab
            beer-tracker-android/app/build/outputs/apk/release/*.apk
            beer-tracker-android/app/build/reports/lint-results-release.html
          if-no-files-found: error
